<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EIGHT PHARMACY — 지점 관리자</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#153726">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ── 로그인 화면 ──────────────────────────────────── -->
  <div class="gate" id="gate">
    <form class="gate-card" id="loginForm">
      <div class="gate-brand">
        <span class="brand-symbol" aria-hidden="true"></span>
        <span>EIGHT PHARMACY</span>
      </div>
      <h1 class="gate-title">지점 관리자</h1>
      <p class="gate-desc">관리자 계정으로 로그인하세요.</p>

      <label class="field">
        <span class="field-name">이메일</span>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </label>
      <label class="field">
        <span class="field-name">비밀번호</span>
        <input type="password" id="loginPw" autocomplete="current-password" required>
      </label>

      <button class="btn btn-primary btn-wide" type="submit" id="loginBtn">로그인</button>
      <p class="gate-msg" id="loginMsg" role="alert"></p>
    </form>
  </div>

  <!-- ── 관리자 본문 ──────────────────────────────────── -->
  <div class="admin" id="admin" hidden>

    <header class="bar">
      <div class="bar-left">
        <span class="brand-symbol" aria-hidden="true"></span>
        <div class="bar-titles">
          <strong>지점 관리자</strong>
          <span class="bar-user" id="barUser"></span>
        </div>
      </div>
      <div class="bar-right">
        <span class="dirty-flag" id="dirtyFlag" hidden>저장하지 않은 변경</span>
        <a class="btn btn-ghost" href="index.html" target="_blank" rel="noopener">미리보기</a>
        <button class="btn btn-ghost" type="button" id="reloadBtn">되돌리기</button>
        <button class="btn btn-primary" type="button" id="saveBtn">저장</button>
        <button class="btn btn-ghost" type="button" id="logoutBtn">로그아웃</button>
      </div>
    </header>

    <p class="notice" id="notice" hidden></p>

    <main class="wrap" id="form">

      <!-- 공식 채널 -->
      <section class="panel">
        <h2 class="panel-title">공식 채널</h2>
        <div class="grid-3">
          <label class="field">
            <span class="field-name">계정 표기</span>
            <input type="text" data-path="channels.handle" placeholder="@eight_pharmacy">
          </label>
          <label class="field">
            <span class="field-name">인스타그램 URL</span>
            <input type="url" data-path="channels.instagram" placeholder="https://instagram.com/...">
          </label>
          <label class="field">
            <span class="field-name">틱톡 URL</span>
            <input type="url" data-path="channels.tiktok" placeholder="https://tiktok.com/@...">
          </label>
        </div>
      </section>

      <!-- 지역 -->
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">지역</h2>
          <button class="btn btn-ghost btn-sm" type="button" id="addRegionBtn">+ 지역 추가</button>
        </div>
        <p class="panel-hint">지점을 묶는 상단 필터 항목입니다. 지역을 추가하면 필터에 자동으로 나타납니다.</p>
        <div id="regionList"></div>
      </section>

      <!-- 지점 -->
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">지점 <span class="count-chip" id="branchCountChip"></span></h2>
          <button class="btn btn-ghost btn-sm" type="button" id="addBranchBtn">+ 지점 추가</button>
        </div>
        <div id="branchList"></div>
      </section>

      <!-- 백업 -->
      <section class="panel">
        <h2 class="panel-title">백업</h2>
        <p class="panel-hint">현재 편집 중인 내용을 파일로 내려받거나, 백업 파일에서 되돌릴 수 있습니다.</p>
        <div class="row-btns">
          <button class="btn btn-ghost btn-sm" type="button" id="exportBtn">JSON 내보내기</button>
          <label class="btn btn-ghost btn-sm">
            JSON 불러오기
            <input type="file" id="importInput" accept="application/json,.json" hidden>
          </label>
        </div>
      </section>

    </main>

    <div class="save-dock">
      <span class="save-msg" id="saveMsg"></span>
      <button class="btn btn-primary" type="button" id="saveBtn2">저장</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
