<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EIGHT PHARMACY — 지점 안내 | Store Locator</title>
  <meta name="description" content="에이트약국 전 지점 안내. 네이버지도·카카오맵·구글맵·고덕지도 길찾기와 공식 인스타그램·틱톡 채널. 전 지점 택스프리샵(Tax Free Shop).">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EIGHT PHARMACY">
  <meta property="og:title" content="EIGHT PHARMACY — 지점 안내 | Store Locator">
  <meta property="og:description" content="Gangnam · Myeongdong · Jeju. Pharmacist-curated K-beauty. All stores are Tax Free Shops.">
  <meta property="og:image" content="https://8pharmacy.kr/images/main-banner.png">
  <meta name="theme-color" content="#153726">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ── 상단 바 ─────────────────────────────────────── -->
    <header class="top-nav">
      <a class="nav-brand" href="https://8pharmacy.kr" target="_blank" rel="noopener">
        <span class="brand-symbol" aria-hidden="true"></span>
        <span class="brand-text">EIGHT PHARMACY</span>
      </a>

      <div class="lang-switch">
        <button class="lang-toggle" id="langToggle" type="button" aria-haspopup="listbox" aria-expanded="false">
          <img class="lang-flag" id="langFlag" alt="" width="18" height="12">
          <span class="lang-short" id="langShort">KR</span>
          <span class="lang-caret" aria-hidden="true"></span>
        </button>
        <div class="lang-menu" id="langMenu" role="listbox" hidden></div>
      </div>
    </header>

    <!-- ── 히어로 ──────────────────────────────────────── -->
    <section class="hero">
      <div class="hero-inner">
        <p class="hero-eyebrow" data-i18n="heroBadge">K-BEAUTY &amp; DERMATOLOGY</p>
        <h1 class="hero-title" data-i18n="heroTitle">약사가 고른<br>한국 스킨케어</h1>
        <p class="hero-desc" data-i18n="heroDesc">약사가 직접 고르고, 직접 설명해 드리는 더마 스킨케어.</p>
        <ul class="hero-badges">
          <li class="badge-item"><span class="badge-ico" data-ico="receipt"></span><span data-i18n="badgeTax">택스프리샵</span></li>
          <li class="badge-item"><span class="badge-ico" data-ico="shield"></span><span data-i18n="badgeConsult">전문 피부 상담</span></li>
        </ul>
      </div>
    </section>

    <!-- ── 필터 아일랜드 ───────────────────────────────── -->
    <div class="island">
      <div class="island-field">
        <label class="field-label" for="regionFilter" data-i18n="filterRegionLabel">지역</label>
        <select id="regionFilter" class="field-select"></select>
      </div>
      <span class="island-divider" aria-hidden="true"></span>
      <div class="island-field">
        <label class="field-label" for="statusFilter" data-i18n="filterStatusLabel">영업</label>
        <select id="statusFilter" class="field-select"></select>
      </div>
      <button class="island-btn" id="scrollBtn" type="button" aria-label="Go to list">
        <span data-ico="arrow-down"></span>
      </button>
    </div>

    <!-- ── 공식 채널 ───────────────────────────────────── -->
    <section class="block">
      <div class="block-head">
        <h2 class="block-title" data-i18n="channelsTitle">공식 채널</h2>
        <span class="block-sub" id="channelHandle"></span>
      </div>
      <div class="channels" id="channelList"></div>
    </section>

    <!-- ── 지점 목록 ───────────────────────────────────── -->
    <section class="block" id="branchSection">
      <div class="block-head">
        <h2 class="block-title" data-i18n="branchTitle">지점 안내</h2>
        <span class="block-badge" id="branchCount"></span>
      </div>
      <div class="branches" id="branchList"></div>
      <p class="empty-note" id="emptyNote" hidden data-i18n="emptyNote">조건에 맞는 지점이 없습니다.</p>
    </section>

    <!-- ── 푸터 ────────────────────────────────────────── -->
    <footer class="site-footer">
      <div class="tax-banner">
        <span class="tax-ico" data-ico="badge-check"></span>
        <p data-i18n="taxNotice">전 지점 택스프리샵 (Tax Free Shop)</p>
      </div>
      <a class="foot-link" href="https://8pharmacy.kr" target="_blank" rel="noopener">8pharmacy.kr</a>
      <p class="copyright">© 2026 EIGHT PHARMACY</p>
    </footer>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="script.js"></script>
</body>
</html>
