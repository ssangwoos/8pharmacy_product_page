<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPIRIS · Find What Fits You</title>
<meta name="description" content="EPIRIS — Find What Fits You. Tell us what you need and find the products that fit you.">
<meta property="og:title" content="EPIRIS · Find What Fits You">
<meta property="og:description" content="Tell us what you need and find the products that fit you.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0F2748">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F2748'/%3E%3Ccircle cx='14' cy='14' r='8' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M20.2 20.2 26 26' stroke='%23fff' stroke-width='2.8' stroke-linecap='round'/%3E%3Cpath d='M14 10.2v7.6M10.2 14h7.6' stroke='%231DB7A6' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ───────── 토큰: 화이트 바탕 · 네이비 골격 · 틸 포인트 (색의 역할은 유지하고 EPIRIS 색으로) ───────── */
:root{
  --img-zoom:1.2;        /* 제품 사진 확대 (사진 자체에 여백이 많아서). a_config.js 의 IMG_ZOOM 으로 바꿉니다 */
  --navy:#0F2748;        /* 제목 · 주요 버튼 · 공지 · 푸터 */
  --navy-2:#1C3C6B;      /* 버튼 hover */
  --ink:#3F4A5E;         /* 본문 */
  --white:#FFFFFF;
  --accent:#1DB7A6;      /* 선택 표시 · 작은 장식 (글자에는 쓰지 않음) */
  --accent-text:#0A776C; /* 선택된 글자 · 링크 (흰 바탕 대비 5:1 이상) */
  --line:#DFE2EB;
  --media:#F5F6FA;       /* 상품 이미지 면 */
  --mint:#DDF0ED; --lav:#E8EAF5; --butter:#F5EED6;   /* 캠페인 색면 */
  --warn:#B3261E;
  --r:4px;
  --font:"DM Sans","Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--white);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.announce :focus-visible,.ft :focus-visible{outline-color:#fff}
.num{font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:1330px;margin-inline:auto;padding-inline:50px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ───────── 버튼 ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 20px;border-radius:var(--r);
  background:var(--navy);color:#fff;font-size:14px;font-weight:700;line-height:1.25;text-align:center;transition:background-color .18s ease}
.btn:hover{background:var(--navy-2)}
.btn:disabled{background:var(--line);color:var(--ink);cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn.ghost:hover{background:var(--media)}
.btn.full{width:100%}
.flat{display:flex;align-items:center;justify-content:center;min-height:48px;padding:10px 12px;border-radius:var(--r);
  border:1px solid var(--line);font-size:13px;font-weight:600;text-align:center;line-height:1.3;color:var(--ink)}
.textlink{color:var(--accent-text);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:4px;min-height:44px;display:inline-flex;align-items:center}

/* ───────── 공지 · 헤더 ───────── */
.announce{background:var(--navy);color:#fff;text-align:center;font-size:14px;padding:8px 15px}
.status{background:#FFF7E3;color:#6B4E12;font-size:13px;padding:7px 15px;text-align:center;border-bottom:1px solid #EBD9A8}
.status.bad{background:#FDECEA;color:#8C1D18;border-color:#F3C2BD}
.hd{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd-row{display:flex;align-items:center;gap:24px;padding-block:14px}
.logo{display:flex;align-items:center;gap:9px;color:var(--navy);font-weight:700;font-size:23px;letter-spacing:.12em;white-space:nowrap}
.logo svg{width:28px;height:28px;flex:none}
.hd-search{flex:1;max-width:520px;display:flex;border:1.5px solid var(--navy);border-radius:var(--r);overflow:hidden}
.hd-search input{flex:1;min-width:0;height:44px;border:0;outline:0;padding:0 14px;font-size:15px;background:#fff}
.hd-search button{padding:0 18px;background:var(--navy);color:#fff;font-size:14px;font-weight:700}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.langsel{height:44px;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:0 8px;font-size:14px;max-width:120px}
.iconbtn{min-width:44px;height:44px;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 10px;font-size:14px;font-weight:600;color:var(--navy);white-space:nowrap}
.iconbtn:hover{background:var(--media)}
.iconbtn svg{width:22px;height:22px}
.cartn{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.menu-btn{display:none}
.hd-nav{display:flex;flex-wrap:wrap;gap:4px 26px;padding-bottom:10px}
.hd-nav a,.hd-nav button{min-height:40px;display:inline-flex;align-items:center;font-size:15px;font-weight:600;color:var(--navy);border-bottom:2px solid transparent}
.hd-nav a:hover,.hd-nav button:hover{border-bottom-color:var(--line)}
.hd-nav [aria-current="page"]{color:var(--accent-text);border-bottom-color:currentColor}

main{min-height:60vh}
.view{display:none}.view.on{display:block}
.sec{margin-block:80px}
.sec-title{color:var(--navy);font-size:36px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.loading{padding:120px 0;text-align:center;color:var(--ink)}

/* ───────── 홈: 2:1 비대칭 히어로 ───────── */
.hero{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:24px}
.hc{min-width:0;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;background:var(--lav)}
.hc.big{grid-row:span 2;background:var(--mint)}
.hc.c{background:var(--butter)}
.lineup{height:250px;display:flex;align-items:flex-end;justify-content:center;gap:3%;padding:26px 8% 0}
.hc.big .lineup{height:400px;padding:40px 9% 0}
.lineup .li{flex:1 1 0;min-width:0;max-width:150px;height:var(--h,80%);display:flex;align-items:flex-end;justify-content:center}
.hc.big .lineup .li{max-width:190px}
.lineup img{max-height:100%;width:100%;object-fit:contain;object-position:bottom;mix-blend-mode:multiply;transform:scale(var(--img-zoom));transform-origin:50% 100%}
.lineup .ph{width:70%;height:100%;border-radius:10px 10px 0 0;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--navy)}
.lineup .li:nth-child(1){--h:64%}.lineup .li:nth-child(2){--h:80%}.lineup .li:nth-child(3){--h:100%}.lineup .li:nth-child(4){--h:76%}.lineup .li:nth-child(5){--h:60%}
.hc-info{flex:1;display:grid;align-content:start;gap:12px;padding:32px 32px 26px;background:inherit}
.hc.big .hc-info{padding:40px 44px 36px;gap:14px}
.hc-title{color:var(--navy);font-size:24px;line-height:1.2;font-weight:700}
.hc.big .hc-title{font-size:34px;line-height:1.15}
.hc-sub{font-size:15px;max-width:34em}
.askform{display:flex;gap:8px;margin-top:6px;max-width:620px}
.askform input{flex:1;min-width:0;height:52px;border:1.5px solid var(--navy);border-radius:var(--r);padding:0 16px;background:#fff;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:var(--r);background:rgba(255,255,255,.75);color:var(--navy);font-size:14px;font-weight:600}
.chip:hover{background:#fff}

/* ───────── 탭 · 상품 스트립 · 상품 카드 ───────── */
.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;min-height:44px;padding:8px 0;border-bottom:2px solid transparent;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent-text);border-bottom-color:currentColor;font-weight:700}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
[hidden]{display:none!important}
.pc{min-width:0;display:flex;flex-direction:column}
/* 의약품(오프라인 약국 only): 살짝 회색, 마우스를 올리면 원래 색 */
.pc.drug .pc-media{filter:grayscale(1);opacity:.72;transition:filter .2s,opacity .2s}
.pc.drug .pc-name a,.pc.drug .pc-why{color:#7A8395;transition:color .2s}
.pc.drug .flat{background:#F1F2F5;color:#6B7486;border-color:#E3E5EB}
.pc.drug:hover .pc-media,.pc.drug:focus-within .pc-media{filter:none;opacity:1}
.pc.drug:hover .pc-name a,.pc.drug:focus-within .pc-name a{color:var(--navy)}
.pc.drug:hover .pc-why,.pc.drug:focus-within .pc-why{color:var(--accent-text)}
.pc-media{display:block;aspect-ratio:1;background:var(--media);border-radius:var(--r);overflow:hidden}
.pc-media img{width:100%;height:100%;object-fit:contain;padding:9%;mix-blend-mode:multiply;transform:scale(var(--img-zoom))}
.pc-media .ph{width:100%;height:100%;display:grid;place-items:center;font-size:34px;font-weight:700;color:#B8BFD0}
.pc-body{flex:1;display:flex;flex-direction:column;gap:6px;padding-top:14px}
.pc-name{font-size:16px;line-height:1.4;font-weight:500;color:var(--navy);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.pc-name a:hover{text-decoration:underline;text-underline-offset:3px}
.pc-why{font-size:13.5px;line-height:1.5;color:var(--accent-text);font-weight:500}
.pc-price{font-weight:700;color:var(--navy);min-height:1.65em}
.pc-body .btn,.pc-body .flat{width:100%;margin-top:auto}
.pc .gap{margin-top:auto}

/* ───────── 고민 타일 · 2분할 캠페인 ───────── */
.tiles{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.tile-media{aspect-ratio:1;border-radius:var(--r);background:var(--media);overflow:hidden;width:100%}
.tile-media img{width:100%;height:100%;object-fit:contain;padding:12%;mix-blend-mode:multiply;transform:scale(var(--img-zoom))}
.tile-media .ph{width:100%;height:100%;display:grid;place-items:center;font-size:28px;font-weight:700;color:#B8BFD0}
.tile b{color:var(--navy);font-size:15px;line-height:1.3}
.tile span{font-size:13px}
.tile:hover b{text-decoration:underline;text-underline-offset:3px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.split > div{border-radius:var(--r);padding:44px;display:grid;gap:14px;align-content:start;justify-items:start}
.split h3{color:var(--navy);font-size:26px;line-height:1.25;font-weight:700}
.split p{max-width:30em}
.split ol{margin:0;padding-left:1.2em;display:grid;gap:6px}

/* ───────── 약사 상담 ───────── */
.consult{max-width:960px;margin-inline:auto;padding-bottom:150px}
.pg-title{color:var(--navy);font-size:32px;line-height:1.2;font-weight:700;margin:36px 0 6px}
.crumb{font-size:13px;margin-top:22px}
.crumb a{text-decoration:underline;text-underline-offset:3px}
.thread{display:flex;flex-direction:column;gap:20px;margin-top:24px}
.me{align-self:flex-end;max-width:84%;background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:15px}
.me.narrow{background:#fff;color:var(--accent-text);box-shadow:inset 0 0 0 1.5px var(--accent-text);font-weight:700}
.note{border:1px solid var(--line);border-radius:var(--r);padding:28px}
.note-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--navy)}
.note-head b{color:var(--navy);font-size:18px}
.note-head span{font-size:13px}
.say{color:var(--navy);font-size:18px;line-height:1.65;font-weight:500;margin:18px 0 22px;max-width:40em}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.note .more{margin-top:8px}
.notice{font-size:14px;border-left:3px solid var(--warn);padding:10px 14px;background:#FCF1F0;margin-top:18px;line-height:1.55;color:#5E2320}
.ask-q{color:var(--navy);font-size:16px;font-weight:700;margin-top:26px}
.down{margin-top:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.down button{min-height:48px;padding:8px 10px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;font-size:15px;font-weight:600;color:var(--navy);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.down button:hover:not(:disabled){border-color:var(--navy)}
.down button:disabled{opacity:.45;cursor:default}
.fine{margin-top:18px;font-size:12.5px;line-height:1.6}
.cmp{margin-top:12px;border:1px dashed #C9A45C;border-radius:var(--r);background:#FFFDF6;font-size:13px;line-height:1.55;color:var(--ink)}
.cmp-head{padding:8px 12px;border-bottom:1px dashed #C9A45C;color:#6B4E12;font-size:12px}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr}
.cmp-col{padding:12px 14px;min-width:0}
.cmp-col + .cmp-col{border-left:1px dashed #C9A45C}
.cmp-col h4{font-size:14px;color:var(--navy);margin-bottom:6px}
.cmp-col.main h4{color:var(--accent-text)}
.cmp-col p{margin-bottom:6px}
.cmp-col ol{margin:6px 0 8px 18px}
.cmp-col li{margin-bottom:6px}
.cmp-k b{color:var(--navy);margin-right:4px}
.cmp-k .num{color:#6B4E12;font-size:12px;margin-left:4px}
.cmp-err{color:var(--warn);font-weight:600}
.aiset{border:0;border-top:1.5px solid var(--navy);margin:26px 0 18px;padding:16px 0 0}
.aiset legend{font-size:17px;font-weight:700;color:var(--navy);padding-right:10px}
.aiset-h{font-size:13.5px;font-weight:600;color:var(--navy);margin:4px 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--r);font-weight:700;color:var(--navy)}
.seg small,.sw small{display:block;font-weight:500;font-size:12px;color:var(--ink);margin-top:2px}
.seg input:checked + span{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--mint)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.sw{position:relative;display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14.5px;color:var(--navy);font-weight:600}
.sw input{position:absolute;opacity:0}
.sw i{flex:none;width:42px;height:24px;border-radius:12px;background:#C5CAD6;position:relative;margin-top:1px}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.sw input:checked + i{background:var(--accent-text)}
.sw input:checked + i::after{left:21px}
.sw input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){.cmp-grid{grid-template-columns:1fr}.cmp-col + .cmp-col{border-left:0;border-top:1px dashed #C9A45C}}
.diag{margin-top:12px;padding:8px 10px;border:1px dashed #C9A45C;border-radius:var(--r);background:#FFF9EC;color:#6B4E12;font-size:12px;line-height:1.55}
.wait{display:flex;gap:10px;align-items:center;padding:6px 2px}
.wait i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bob 1s infinite ease-in-out}
.wait i:nth-child(2){animation-delay:.15s}.wait i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{opacity:.25}50%{opacity:1}}
.empty-consult{margin-top:22px;display:grid;gap:14px;justify-items:start}
.empty-consult .chip{background:var(--media)}
.empty-consult .chip:hover{background:var(--lav)}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:12px 15px}
.composer-in{max-width:960px;margin:0 auto;display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;min-height:52px;max-height:120px;border:1.5px solid var(--navy);border-radius:var(--r);outline:0;resize:none;background:#fff;font-size:16px;line-height:1.5;padding:12px 14px}
.sq{width:52px;height:52px;border-radius:var(--r);display:grid;place-items:center;flex:none;background:var(--navy);color:#fff}
.sq.mic{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.sq.mic.live{background:var(--warn);color:#fff;box-shadow:none}
.sq svg{width:22px;height:22px}

/* ───────── 상품 목록 ───────── */
.coll{display:grid;grid-template-columns:240px minmax(0,1fr);gap:35px;margin:24px 0 80px}
.coll-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.coll-top select{height:44px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;background:#fff;font-size:14px}
.mk-search{display:none;width:100%;height:48px;border:1.5px solid var(--navy);border-radius:var(--r);padding:0 14px;font-size:16px;margin-bottom:12px}
.filter-open{display:none}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.picked button{min-height:36px;padding:4px 12px;border-radius:var(--r);background:var(--navy);color:#fff;font-size:13.5px;font-weight:600}
.picked .clear{background:none;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.fg{border-top:1px solid var(--line);padding:14px 0}
.fg h3{color:var(--navy);font-size:15px;font-weight:700;margin-bottom:6px}
.fopt{display:flex;align-items:center;gap:9px;width:100%;min-height:36px;font-size:14.5px;text-align:left}
.fopt i{flex:none;width:16px;height:16px;border:1.5px solid #9AA3B8;border-radius:3px}
.fopt.on{color:var(--accent-text);font-weight:700}
.fopt.on i{background:var(--accent-text);border-color:var(--accent-text);box-shadow:inset 0 0 0 2.5px #fff}
.fopt span:last-child{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--ink)}
.fopt:hover{text-decoration:underline;text-underline-offset:3px}
.fmore{font-size:13px;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px;min-height:36px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 12px}
.empty{padding:60px 0;text-align:center;display:grid;gap:14px;justify-items:center}

/* ───────── 상품 상세 ───────── */
.pd{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:start;margin:24px 0 0}
.pd > *{min-width:0}
.pd-media{aspect-ratio:1;background:var(--media);border-radius:var(--r);overflow:hidden}
.pd-media img{width:100%;height:100%;object-fit:contain;padding:8%;mix-blend-mode:multiply;transform:scale(var(--img-zoom))}

    ]);

    if(ft) ft.forEach(d=>{ const x=d.data(); if(x.tag_id&&x.lang){ (FIRST[x.lang]=FIRST[x.lang]||{})[x.tag_id]=(FIRST[x.lang][x.tag_id]||0)+1; } });

function findTagIdByName(name){
  return Object.keys(TAG_MASTER).find(id=> ((TAG_MASTER[id].names&&TAG_MASTER[id].names.kr)||TAG_MASTER[id].raw||"")===name ) || null;
}

/* ════════════════════════════════════════════════════════════
   6. 태그 엔진 (키오스크와 같은 규칙)
   ════════════════════════════════════════════════════════════ */
function isClassTag(tid){ const tg=TAG_MASTER[tid]; const nm=(tg&&tg.names&&tg.names.kr)||(tg&&tg.raw)||""; return nm==="의약품"||nm==="비의약품"; }
// 한 태그의 상위 전부 (parents 가 없던 예전 데이터는 linkedTo 하나)
function parentsOf(tid){ const x=TAG_MASTER[tid]; if(!x) return []; return [...new Set([...(x.parents||[]),x.linkedTo].filter(p=>p&&p!==tid&&TAG_MASTER[p]))]; }
const tagType=tid=>(TAG_MASTER[tid]&&TAG_MASTER[tid].type)||"기타";
const hiddenTag=tid=>tagType(tid)==="내부";                      // 매장 정리용: 검색에는 쓰이지만 고객에게 보여 주지 않음
const askableTag=tid=>!hiddenTag(tid)&&tagType(tid)!=="브랜드";   // 약사 질문의 답으로 쓸 수 있는 태그
function tagName(tid,lang){ const tg=TAG_MASTER[tid]; if(!tg) return ""; const L=lang||LANG; return String((tg.names&&tg.names[L])||(tg.names&&tg.names.kr)||tg.raw||tid); }
// 같은 이름의 태그 + 동의어로 서로 묶인 태그를 한 묶음으로 봅니다 ("알러지"⇄"알레르기")
function tagGroup(tid){
  const tg=TAG_MASTER[tid], label=tagName(tid).toLowerCase(); if(!tg||!label) return [tid];
  const mine=new Set([label,tagName(tid,"kr").toLowerCase(),...(tg.synonyms||[]).map(s=>String(s||"").toLowerCase())]);
  return Object.keys(TAG_MASTER).filter(id=>{ if(id===tid) return true; const o=TAG_MASTER[id], on=tagName(id).toLowerCase(), ok=tagName(id,"kr").toLowerCase();
    return mine.has(on)||mine.has(ok)||(o.synonyms||[]).some(s=>{ s=String(s||"").toLowerCase(); return s===label||s===tagName(tid,"kr").toLowerCase(); }); });
}
function tagDepth(tid,inSet,guard){
  guard=guard||new Set(); if(guard.has(tid)) return 0; guard.add(tid);
  const parent=TAG_MASTER[tid]&&TAG_MASTER[tid].linkedTo;
  if(!parent||!TAG_MASTER[parent]) return 0;
  if(inSet&&!inSet.has(parent)) return 0;
  return 1+tagDepth(parent,inSet,guard);
}
// 태그명·동의어와 글자가 완전히 같은 태그 (띄어쓰기 무시)
function exactTag(s){
  const k=String(s).toLowerCase().replace(/\s+/g,""); if(k.length<2) return null;
  return Object.keys(TAG_MASTER).find(id=>{ const tg=TAG_MASTER[id]; return [...Object.values(tg.names||{}),tg.raw,...(tg.synonyms||[])].some(n=>String(n||"").toLowerCase().replace(/\s+/g,"")===k); }) || null;
}
// 한 말이 여러 태그의 연관어로 등록된 경우 그 태그 전부 ("눈" → 안약·눈영양제·인공눈물)
function relatedTags(kw){
  const kk=String(kw).toLowerCase().replace(/\s+/g,""); if(!kk) return [];
  return Object.keys(TAG_MASTER).filter(id=>(TAG_MASTER[id].related||[]).some(n=>String(n||"").toLowerCase().replace(/\s+/g,"")===kk));
}
function matchKeywordToTag(kw){
  const k=String(kw).toLowerCase().trim(); if(!k) return null;
  const ex=exactTag(k); if(ex) return ex;          // "눈 영양제" 처럼 띄어 쓴 것도 같은 태그로
  const kk=k.replace(/\s+/g,""), rel=Object.keys(TAG_MASTER).find(id=>(TAG_MASTER[id].related||[]).some(n=>String(n||"").toLowerCase().replace(/\s+/g,"")===kk));
  if(rel) return rel;                                // 연관어: 뜻은 다르지만 이 태그로 이어지는 말 ("소양증"→가려움, "루테인"→눈영양제)
  const ids=Object.keys(TAG_MASTER);
  const cand=id=>{ const tg=TAG_MASTER[id]; return [...Object.values(tg.names||{}),...(tg.synonyms||[])].map(s=>(s||"").toLowerCase()).filter(Boolean); };
  const exact=ids.find(id=>cand(id).includes(k)); if(exact) return exact;
  const incl=ids.find(id=>cand(id).some(n=> (n.length>=2&&k.includes(n)) || (k.length>=2&&n.includes(k)) )); if(incl) return incl;
  if(k.length>=2){ const byC=ids.find(id=>{ const cm=(TAG_MASTER[id].comment||"").toLowerCase(); return cm&&cm.includes(k); }); if(byC) return byC; }
  return null;
}
// 문장 안에 들어 있는 태그명·동의어를 직접 찾기 (AI 가 응답하지 않을 때도 문장 검색이 되도록)
function localTags(raw){
  const low=String(raw||"").toLowerCase(), s=low.replace(/\s+/g,""); if(s.length<2) return [];
  const names=id=>{ const tg=TAG_MASTER[id]; return [...Object.values(tg.names||{}),tg.raw,...(tg.synonyms||[]),...(tg.related||[])].map(x=>String(x||"").toLowerCase().replace(/\s+/g,"")).filter(n=>n.length>=2); };
  const ids=Object.keys(TAG_MASTER).filter(id=>!isClassTag(id)), hit=[], got=new Set();
  // 1) 문장 안에 태그명·동의어가 그대로 들어 있는 경우 ("얼굴이 건조해요" → 얼굴, 건조)
  ids.forEach(id=>{ const best=names(id).filter(n=>s.includes(n)).sort((a,b)=>b.length-a.length)[0]; if(best){ hit.push([100+best.length,id]); got.add(id); } });
  // 2) 문장 속 단어의 앞 2~3글자로 시작하는 태그 ("소화가안돼" → 소화제·소화불량·소화장애). 제품이 많이 달린 태그 먼저
  const heads=new Set(); low.split(/\s+/).filter(w=>/^[가-힣]{2,}/.test(w)).forEach(w=>{   // 한글 단어만 (영문은 앞글자가 겹치는 엉뚱한 태그가 걸림)
     heads.add(w.slice(0,2)); if(w.length>=3) heads.add(w.slice(0,3)); });
  if(heads.size){ const use={}; PRODUCTS.forEach(p=>p.tag_ids.forEach(x=>use[x]=(use[x]||0)+1));
    ids.filter(id=>!got.has(id)&&use[id]).forEach(id=>{ const h=names(id).some(n=>[...heads].some(k=>n.length>k.length&&n.startsWith(k))); if(h) hit.push([Math.min(use[id],99),id]); }); }
  return hit.sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
}
// 문장 → (AI 키워드 추출) → 태그 매칭. 상담과 검색이 같이 씁니다.
async function analyze(raw, prev){
  let k, kwCompare=null;
  if(aiCompare()){   // 두 AI 동시 호출 → 주 AI 결과로 진행 (주가 실패하면 다른 쪽)
    const ps=["openai","claude"], rs=await Promise.all(ps.map(p=>aiKeywords(raw,prev||"",p)));
    kwCompare=ps.map((p,i)=>({p,keywords:rs[i].keywords,ms:AI_STATE[p].ms,error:AI_STATE[p].ok===false?AI_STATE[p].error:""}));
    const mi=ps.indexOf(AI.primary==="claude"?"claude":"openai"); k=rs[mi].keywords.length?rs[mi]:rs[1-mi];
  }else k=await aiKeywords(raw, prev||"");
  const usedAI=k.keywords.length>0, kws=usedAI?k.keywords:[raw,...raw.split(/\s+/)];
  const seen=new Set(), tags=[], unmatched=[];
  // 제품이 아직 하나도 안 달린 하위 태그면 상위 태그로 올려서 찾습니다 ("안대" 태그에 제품이 없으면 → "눈")
  const has=tid=>{ const g=new Set(tagGroup(tid)); return PRODUCTS.some(p=>p.tag_ids.some(x=>g.has(x))); };
  const up=tid=>{ if(has(tid)) return [tid]; let level=[tid]; const seenUp=new Set(level);          // 상위가 여럿이면 제품이 있는 상위 전부
    for(let i=0;i<4;i++){ level=[...new Set(level.flatMap(parentsOf))].filter(x=>!seenUp.has(x)); if(!level.length) return [tid]; level.forEach(x=>seenUp.add(x)); const ok=level.filter(has); if(ok.length) return ok; } return [tid]; };
  const add1=tid=>{ const label=tagName(tid).toLowerCase(); if(!label||seen.has(label)||isClassTag(tid)) return; seen.add(label); tags.push(tid); };
  const add=tid=>up(tid).forEach(add1);
  // 키워드 둘을 붙이면 태그명이 되는 경우 먼저 ("눈"+"영양제" → 눈영양제). 붙여서 쓴 두 단어는 따로 매칭하지 않음
  const joined=new Set();
  if(usedAI) for(let i=0;i<kws.length;i++) for(let j=0;j<kws.length;j++){ if(i===j) continue;
    const tid=exactTag(String(kws[i]).replace(/\s+/g,"")+String(kws[j]).replace(/\s+/g,""));
    if(tid&&!isClassTag(tid)){ add(tid); joined.add(kws[i]); joined.add(kws[j]); } }
  kws.filter(w=>!joined.has(w)&&!BLOCKED_KW.has(String(w).toLowerCase())).forEach(w=>{
    const rel=exactTag(w)?[]:relatedTags(w); if(rel.length>1){ rel.forEach(add); return; }
    const tid=matchKeywordToTag(w);
    if(!tid){ if(w!==raw&&usedAI) unmatched.push(w); return; }
    add(tid);
  });
  if(!usedAI||!tags.length) localTags(raw).filter(x=>!BLOCKED_KW.has(tagName(x,"kr").toLowerCase())).slice(0,6).forEach(add);
  return { kws, tags, unmatched, usedAI, followup:k.followup, kwCompare };
}
// 문장 + 태그 → 관련도순 제품 목록
function scoreProducts(raw, tagIds, list){
  const words=String(raw||"").toLowerCase().split(/\s+/).filter(w=>w.length>=2);
  // 태그 묶음마다 한 번만 점수 (동의어로 묶인 태그를 둘 다 가진 제품이 두 배로 올라가지 않게)
  const groups=[]; tagIds.forEach(tg=>{ const g=tagGroup(tg), hit=groups.find(s=>g.some(x=>s.has(x))); if(hit) g.forEach(x=>hit.add(x)); else groups.push(new Set(g)); });
  // 약사 층: 이 태그들에 대해 약사가 먼저 권한다고 정한 제품은 맨 위로, 권하지 않는다고 한 제품은 뺍니다
  const first=new Map(), avoid=new Set();
  groups.forEach(g=>g.forEach(t=>{ const pf=PREFS[t]; if(!pf) return; (pf.first||[]).forEach((id,i)=>{ if(!first.has(id)) first.set(id,i); }); (pf.avoid||[]).forEach(id=>avoid.add(id)); }));
  const out=[];
  (list||PRODUCTS).forEach(p=>{
    if(avoid.has(p.id)) return;
    const nm=p.name.toLowerCase();
    let s = words.filter(w=>nm.includes(w)).length*3 + groups.filter(g=>p.tag_ids.some(x=>g.has(x))).length*2;
    if(first.has(p.id)) s += 100 - first.get(p.id);
    if(s>0) out.push([s,p]);
  });
  return out.sort((a,b)=> b[0]-a[0] || b[1].views-a[1].views).map(x=>x[1]);
}
// 이 태그들에서 약사가 먼저 권한다고 정한 제품 ID (순서대로)
function pharmacistFirst(tagIds){ const ids=[]; tagIds.forEach(t=>tagGroup(t).forEach(g=>((PREFS[g]&&PREFS[g].first)||[]).forEach(id=>{ if(!ids.includes(id)) ids.push(id); }))); return ids; }
// 이 제품 묶음을 더 좁힐 수 있는 태그 (상위 먼저 → 8개 제한 = 하위 가림)
function nextTags(pool, usedTagIds, lastTag){
  const used=new Set(); usedTagIds.forEach(tg=> tagGroup(tg).forEach(g=>used.add(g)));
  const freq={};
  pool.forEach(p=>p.tag_ids.forEach(tid=>{ if(TAG_MASTER[tid]&&!isClassTag(tid)&&!hiddenTag(tid)&&!used.has(tid)) freq[tid]=(freq[tid]||0)+1; }));
  const seen=new Set();
  let ids=Object.keys(freq).filter(tid=> freq[tid]<pool.length)          // 전부에 붙은 태그는 좁히는 데 쓸모없음
    .filter(tid=>{ const l=tagName(tid).toLowerCase(); if(seen.has(l)) return false; seen.add(l); return true; });
  const inSet=new Set(ids);
  // 같은 깊이 안에서는: 실제로 사람들이 이 다음에 많이 누른 태그 → 제품 수 순
  const learned={}; (lastTag?tagGroup(lastTag):[]).forEach(g=>{ const m=TRANS[g]||{}; Object.keys(m).forEach(k=> learned[k]=(learned[k]||0)+m[k]); });
  const w=tid=> freq[tid] + 3*(learned[tid]||0);
  ids.sort((a,b)=> tagDepth(a,inSet)-tagDepth(b,inSet) || w(b)-w(a));
  return ids.slice(0,MAX_TAGS);
}

/* AI 엔진 설정 (관리자 화면에서 바꿈 → settings/ai_pharmacist.ai 에 저장)
   primary        : 주로 쓰는 AI  "openai" | "claude"
   backupForOpenai: OpenAI 가 주일 때 실패하면 Claude 로 넘어갈지
   backupForClaude: Claude 가 주일 때 실패하면 OpenAI 로 넘어갈지
   compare        : 두 AI 를 동시에 불러 나란히 보여줄지 (관리자 모드에서만 동작) */
let AI={ primary:"openai", backupForOpenai:false, backupForClaude:false, compare:false };
let CLAUDE_KEY="";
const AI_LABEL={ openai:"OpenAI", claude:"Claude" };
let AI_STATE={ openai:{ok:null,error:"",ms:0}, claude:{ok:null,error:"",ms:0}, last:"" };   // 마지막 호출 결과 (관리자 표시줄)
const aiReady = p => AI_ENDPOINT ? true : p==="claude" ? !!CLAUDE_KEY : !!OPENAI_KEY;
// 중계 서버로 보내기 (키는 서버에만 있음)
async function viaServer(provider, messages, temperature){
  const res=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({provider,messages,temperature})});
  const data=await res.json().catch(()=>({}));
  if(typeof data.content!=="string") throw new Error(data.error||("서버 응답 "+res.status));
  return parseJSON(data.content);
}
const aiCompare = () => ADMIN_MODE && AI.compare;
function parseJSON(text){ const s=String(text||""), a=s.indexOf("{"), b=s.lastIndexOf("}"); return JSON.parse(a>=0&&b>a ? s.slice(a,b+1) : s); }
function quotaMsg(name,site){ return name+" 크레딧이 소진되었습니다 ("+site+" 결제 설정에서 충전 필요)"; }

async function callOpenAI(messages, temperature){
  if(AI_ENDPOINT) return viaServer("openai",messages,temperature);
  if(!OPENAI_KEY) throw new Error("OpenAI 키가 없습니다 (settings/config.openai_key)");
  const res=await fetch("https://api.openai.com/v1/chat/completions",{ method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+OPENAI_KEY},
    body:JSON.stringify({model:GPT_MODEL,messages,response_format:{type:"json_object"},temperature}) });
  const data=await res.json();
  if(data.error) throw new Error(data.error.type==="insufficient_quota" ? quotaMsg("OpenAI","platform.openai.com") : data.error.message);
  return parseJSON(data.choices[0].message.content);
}
async function callClaude(messages, temperature){
  if(AI_ENDPOINT) return viaServer("claude",[...messages.slice(0,-1),{...messages[messages.length-1],content:messages[messages.length-1].content+"\n반드시 JSON 객체 하나만 출력한다. 설명이나 코드블록 표시를 붙이지 않는다."}],temperature);
  if(!CLAUDE_KEY) throw new Error("Claude 키가 없습니다 (settings/config.anthropic_key)");
  const system=messages.filter(m=>m.role==="system").map(m=>m.content).join("\n")+"\n반드시 JSON 객체 하나만 출력한다. 설명이나 코드블록 표시를 붙이지 않는다.";
  const res=await fetch("https://api.anthropic.com/v1/messages",{ method:"POST",
    headers:{"content-type":"application/json","x-api-key":CLAUDE_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    // 이 모델은 temperature 를 받지 않고(넣으면 오류), 생각 과정(thinking)을 켜 두면 답이 중간에 잘려 JSON 이 깨짐 → 끔
    body:JSON.stringify({model:CLAUDE_MODEL,max_tokens:2000,thinking:{type:"disabled"},system,messages:messages.filter(m=>m.role!=="system")}) });
  
  const data=await res.json();
  if(data.error||data.type==="error"){ const m=(data.error&&data.error.message)||"오류"; throw new Error(/credit balance/i.test(m) ? quotaMsg("Claude","console.anthropic.com") : m); }
  return parseJSON((data.content||[]).filter(x=>x.type==="text").map(x=>x.text).join(""));
}
async function callAI(provider, messages, temperature){
  const t0=performance.now();
  try{
    const out=await (provider==="claude"?callClaude:callOpenAI)(messages,temperature);
    AI_STATE[provider]={ok:true,error:"",ms:Math.round(performance.now()-t0)}; AI_STATE.last=provider;
    return out;
  }catch(e){
    AI_STATE[provider]={ok:false,error:String(e&&e.message||e).slice(0,140),ms:Math.round(performance.now()-t0)};
    console.error("[EPIRIS] "+AI_LABEL[provider]+" 호출 실패:",AI_STATE[provider].error);
    return null;
  }finally{ if(ADMIN_MODE) renderChrome(); }
}
// 주 AI → (켜져 있으면) 예비 AI 순서로 호출. only 를 주면 그 AI 하나만 호출 (비교 테스트용)
async function gpt(messages, temperature, only){
  if(only) return aiReady(only) ? callAI(only,messages,temperature) : (AI_STATE[only]={ok:false,error:AI_LABEL[only]+" 키가 없습니다",ms:0}, null);
  const first=AI.primary==="claude"?"claude":"openai", second=first==="claude"?"openai":"claude";
  const useBackup = first==="openai" ? AI.backupForOpenai : AI.backupForClaude;
  let out = aiReady(first) ? await callAI(first,messages,temperature) : (AI_STATE[first]={ok:false,error:AI_LABEL[first]+" 키가 없습니다",ms:0}, null);
  if(!out && useBackup && aiReady(second)) out=await callAI(second,messages,temperature);
  return out;
}
// ① 문장 → 키워드 (+ 앞 상담에 이어지는 말인지)
async function aiKeywords(raw, prev, only){
  const r=await gpt([{role:"system",content:"You output JSON only."},{role:"user",content:
    "당신은 약국 제품 검색 도우미입니다. 사용자의 문장에서 약국에서 찾을 만한 핵심 키워드(증상·부위·성분·제품종류·대상)를 한국어 단어로 뽑으세요. "+
    "문장이 외국어여도 키워드는 한국어로. '효능·제품·약·건강·기능·성분'처럼 너무 일반적인 단어는 제외. 짧은 명사, 최대 6개.\n"+
    (prev?("직전 상담 내용: \""+prev+"\"\n이번 문장이 직전 상담에 조건을 더하거나 이어서 묻는 말이면 followup 을 true, 전혀 다른 새 고민이면 false.\n"):"")+
    "사용자입력: \""+raw+"\"\n반환형식: {\"keywords\":[\"단어\"],\"followup\":false}"}],0.2,only);
  return { keywords: r&&Array.isArray(r.keywords) ? r.keywords.map(x=>String(x).trim()).filter(Boolean).slice(0,6) : [],
           followup: !!(prev && r && r.followup) };
}
// ③ 결과가 많을 때: 약사가 카운터에서 되묻듯 질문 1개 + 고객 말투의 답 2~4개 (각 답은 후보 분류 1개에 연결)

    `- 답끼리 tag 가 겹치지 않는다. 브랜드·회사·제품 이름으로 보이는 분류는 쓰지 않는다.\n`+
    `- 앞서 물은 것을 다시 묻지 않는다. 병명을 단정하거나 진단하지 않는다. 용법·용량·특정 제품명을 말하지 않는다.\n`+

  return r&&typeof r==="object" ? r : null;
}
// ② 후보 제품 → 약사의 선택과 이유 (후보 밖 제품은 절대 못 고름)

    "- drug:true 인 제품은 의약품이다. 온라인 판매가 안 되므로 '매장에서 약사와 상담 후 구매'라고 안내한다.\n"+
    "- 하루 몇 번, 몇 알, 몇 mg 같은 용량·횟수·복용법은 절대 쓰지 않는다. 복용법은 매장에서 약사가 안내한다고만 말한다.\n"+
    "- 효과를 보장하거나 과장하지 않는다.\n"+
    `- 모든 문장은 ${LANG_NAME[LANG]||"English"}로 쓴다.\n`+
    `JSON 형식: {"reply":"2~3문장의 소견","picks":[{"id":"후보 id","reason":"이 사람에게 권하는 이유 한 문장"}],"question":"더 좁히기 위한 짧은 질문 하나, 없으면 빈 문자열"}\n`+
    `picks 는 가장 맞는 순서로 최대 ${MAX_PICKS}개.`;
  // 태그엔진에서 약사가 직접 써 둔 코멘트 = 이 약국의 상담 지식
  const notes=(noteTags||[]).map(x=>{ const c=(TAG_MASTER[x]&&TAG_MASTER[x].comment||"").replace(/\s+/g," ").trim(); return c?`- ${tagName(x,"kr")}: ${c.slice(0,180)}`:""; }).filter(Boolean).slice(0,8);
  const mine=pharmacistFirst(noteTags||[]).map(id=>cands.find(p=>p.id===id)).filter(Boolean).map(p=>p.name);
  const user=`고객의 말: "${CASE.raw}"\n`+(mine.length?`이 약국 약사가 이 경우에 먼저 권하는 제품(후보에 있으며, 고객 상황에 맞으면 picks 맨 앞에 둔다): ${mine.join(", ")}\n`:"")+(narrowed.length?`고객이 더 좁힌 조건: ${narrowed.join(", ")}\n`:"")+
    (notes.length?`이 약국 약사가 남긴 메모(판단에 우선 반영):\n${notes.join("\n")}\n`:"")+
    (options&&options.length?`화면에 보여줄 다음 선택지: ${options.join(", ")}\nquestion 은 이 선택지 중 하나를 고르도록 묻는 한 문장으로 쓴다. 선택지에 없는 것을 묻지 않는다.\n`:`question 은 빈 문자열로 둔다.\n`)+
    `후보 제품: ${JSON.stringify(list)}`;
  const r=await gpt([{role:"system",content:sys},{role:"user",content:user}],0.4,only);
  if(!r||!Array.isArray(r.picks)) return null;
  const ok=new Set(cands.map(p=>p.id)), seen=new Set();
  const picks=r.picks.filter(x=>x&&ok.has(x.id)&&!seen.has(x.id)&&seen.add(x.id)).slice(0,MAX_PICKS);
  if(!picks.length) return null;
  return { reply:String(r.reply||""), question:String(r.question||""), picks };
}

async function consult(raw){
  raw=String(raw||"").trim(); if(!raw||BUSY) return;
  BUSY=true;
  MSGS.push({who:"me",text:raw}); MSGS.push({who:"wait"}); renderThread(); scrollEnd();

  const a=await analyze(raw, CASE?CASE.raw:"");
  const kws=a.kws, unmatched=a.unmatched, follow=a.followup&&CASE;
  let tags=a.tags;
  if(follow){ const have=new Set(tags.map(x=>tagName(x).toLowerCase())); tags=[...[...CASE.tags,...CASE.picked].filter(x=>!have.has(tagName(x).toLowerCase())),...tags]; }
  logQuery(raw,tags,unmatched);
  const fullRaw = follow ? CASE.raw+" / "+raw : raw;
  CASE={ raw:fullRaw, tags, picked:[], pool:scoreProducts(fullRaw,tags) };
  await answer(CASE.pool, { kws, unmatched, follow:!!follow }, a.kwCompare);
  BUSY=false;
}
async function narrow(tid){
  if(BUSY||!CASE) return;
  BUSY=true;
  logTransition(CASE.picked[CASE.picked.length-1]||CASE.tags[0], tid);
  CASE.picked.push(tid);
  const groups=CASE.picked.map(x=>new Set(tagGroup(x)));
  const pool=CASE.pool.filter(p=> groups.every(g=> p.tag_ids.some(x=>g.has(x))));
  MSGS.push({who:"me",text:tagName(tid),narrow:true}); MSGS.push({who:"wait"}); renderThread(); scrollEnd();
  await answer(pool);
  BUSY=false;
}
async function answer(pool, diag, kwCompare){
  let msg;
  if(!pool.length){
    const pop=[...PRODUCTS].filter(p=>!p.drug&&p.price).sort((a,b)=>b.views-a.views).slice(0,MAX_PICKS);
    msg={who:"ai",reply:t("none"),picks:pop.map(p=>({id:p.id,reason:t("pop")})),rest:[],tags:[],question:""};
  }else{
    const used=[...CASE.tags,...CASE.picked];
    const last=CASE.picked[CASE.picked.length-1]||CASE.tags[0];
    const next=nextTags(pool,used,last);
    const args=[pool.slice(0,12), CASE.picked.map(x=>tagName(x,"kr")), [...used,...next], next.map(x=>tagName(x))];
    let ai, compare=null;
    if(aiCompare()){
      const ps=["openai","claude"], rs=await Promise.all(ps.map(p=>aiPick(...args,p)));
      compare=ps.map((p,i)=>({p,res:rs[i],ms:AI_STATE[p].ms,error:rs[i]?"":(AI_STATE[p].ok===false?AI_STATE[p].error:"형식에 맞는 답을 받지 못했습니다")}));
      const mi=ps.indexOf(AI.primary==="claude"?"claude":"openai"); ai=rs[mi]||rs[1-mi]; if(ai) AI_STATE.last=rs[mi]?ps[mi]:ps[1-mi];
    }else ai=await aiPick(...args);
    let picks, reply, question="";
    if(ai){ picks=ai.picks; reply=ai.reply; question=next.length?ai.question:""; }
    else{
      const names=used.map(x=>tagName(x)).filter(Boolean).slice(0,3).join(", ");
      reply = names ? t("local",names) : "";
      picks=pool.slice(0,MAX_PICKS).map(p=>{
        const hit=p.tag_ids.filter(x=>used.some(u=>tagGroup(u).includes(x))).map(x=>tagName(x)).slice(0,2).join(", ");
        return {id:p.id,reason: hit?t("localWhy",hit):""};
      });
    }
    const pk=new Set(picks.map(x=>x.id));
    msg={who:"ai",reply,picks,rest:pool.filter(p=>!pk.has(p.id)).slice(0,12).map(p=>p.id),tags:next,question,byAI:!!ai,compare,kwCompare:kwCompare||null,engine:ai?AI_STATE.last:""};
  }
  if(diag) msg.diag={...diag, tags:CASE.tags.map(x=>tagName(x,"kr")), pool:pool.length};
  msg.fresh=true; msg.time=new Date();
  MSGS=MSGS.filter(m=>m.who!=="wait"); MSGS.push(msg);
  renderThread(); scrollEnd(); msg.fresh=false;
}

// 많이 찾는 고민 태그: 실제 첫 선택 기록 → 온라인 판매 제품 수 순
function topTags(n){
  const use={}; sellable().forEach(p=>p.tag_ids.forEach(x=>{ if(!isClassTag(x)&&TAG_MASTER[x]) use[x]=(use[x]||0)+1; }));
  const first=FIRST[LANG]||{}, rank=x=>(first[x]||0)*1000+use[x], seen=new Set();
  return Object.keys(use).filter(x=>use[x]>=2||Object.keys(use).length<12).sort((a,b)=>rank(b)-rank(a))
    .filter(x=>{ const l=tagName(x).toLowerCase(); if(seen.has(l)) return false; seen.add(l); return true; }).slice(0,n)
    .map(x=>({id:x,count:use[x]}));
}
function tagProducts(tid){ const g=new Set(tagGroup(tid)); return sellable().filter(p=>p.tag_ids.some(x=>g.has(x))).sort((a,b)=>b.views-a.views); }
function lineup(list,n){
  const withImg=list.filter(p=>p.image), src=(withImg.length>=Math.min(n,3)?withImg:list).slice(0,n);
  return `<div class="lineup" aria-hidden="true">${src.map(p=>`<div class="li">${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="ph">${esc(p.name.slice(0,1))}</span>`}</div>`).join("")}</div>`;
}

/* ════════════════════════════════════════════════════════════
   11. 화면: 상품 목록 (온라인 판매 제품만) · 태그다운 필터
   ════════════════════════════════════════════════════════════ */
// 검색: 문장을 분석해 키워드 → 태그로 바꾼 뒤, 그 태그의 제품을 보여줍니다 (키오스크와 같은 방식)
async function runSearch(q){
  q=String(q||"").trim(); const seq=++MK.qSeq;
  MK.q=q; MK.qTags=[]; MK.noAsk=false; MK.hist=[]; MK.ask=null; MK.shown=24; MK.qBusy=!!q; MK.qAI=false;
  if($("hdq").value!==q) $("hdq").value=q;
  if(VIEW==="market") renderMarket(); else nav("market");
  if(!q) return;
  const exact=findTagIdByName(q);
  const a = exact&&!isClassTag(exact) ? {tags:[exact],unmatched:[],usedAI:false} : await analyze(q);
  if(seq!==MK.qSeq) return;
  MK.qTags=a.tags; MK.qAI=a.usedAI; MK.qBusy=false;
  logQuery(q,a.tags,a.unmatched);
  if(VIEW==="market") renderMarket();
}
function searchHits(base){
  const q=MK.q.trim().toLowerCase(); if(!q) return base;
  const words=[q,...q.split(/\s+/)].filter(w=>w.length>=2);
  const tagSet=new Set(); MK.qTags.forEach(x=>tagGroup(x).forEach(g=>tagSet.add(g)));
  return base.map(p=>{ const nm=p.name.toLowerCase();
    return [ (nm.includes(q)?6:0) + words.filter(w=>nm.includes(w)).length*3 + p.tag_ids.filter(x=>tagSet.has(x)).length*2, p ]; })
    .filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]||b[1].views-a[1].views).map(x=>x[1]);
}
function marketList(){
  if(!canSeePrice()&&MK.sort!=="pop") MK.sort="pop";            // 가격을 못 보는 동안에는 가격순 정렬도 막음 (순서로 가격이 드러나지 않게)
  const groups=MK.tags.map(x=>new Set(tagGroup(x)));
  let list=sellable().filter(p=> groups.every(g=>p.tag_ids.some(x=>g.has(x))));
  list=searchHits(list);                                   // 검색 중이면 관련도순
  if(MK.sort==="low") list.sort((a,b)=>a.price-b.price);
  else if(MK.sort==="high") list.sort((a,b)=>b.price-a.price);
  else if(!MK.q) list.sort((a,b)=>b.views-a.views);
  return list;
}
// 검색어에 해당하지만 온라인으로 팔지 않는 의약품 (매장 구매 안내용)
function storeHits(){
  if(!MK.q||MK.qBusy) return [];
  const groups=MK.tags.map(x=>new Set(tagGroup(x)));
  return searchHits(PRODUCTS.filter(p=>p.drug&&groups.every(g=>p.tag_ids.some(x=>g.has(x)))));
}
function filtersHTML(list){
  const sel=new Set(); MK.tags.forEach(x=>tagGroup(x).forEach(g=>sel.add(g)));
  const freq={}; list.forEach(p=>p.tag_ids.forEach(x=>{ if(TAG_MASTER[x]&&!isClassTag(x)&&!hiddenTag(x)) freq[x]=(freq[x]||0)+1; }));
  const seen=new Set();
  const ids=[...MK.tags, ...Object.keys(freq).filter(x=>!sel.has(x)&&freq[x]<list.length)]
    .filter(x=>{ const l=tagName(x).toLowerCase(); if(seen.has(l)) return false; seen.add(l); return true; });
  const inSet=new Set(ids), by={};
  ids.forEach(x=>{ let ty=TAG_MASTER[x].type; if(!TYPE_ORDER.includes(ty)) ty="기타"; (by[ty]=by[ty]||[]).push(x); });
  const on=x=>MK.tags.includes(x);
  return TYPE_ORDER.filter(ty=>by[ty]).map(ty=>{
    const arr=by[ty].sort((a,b)=> (on(b)-on(a)) || tagDepth(a,inSet)-tagDepth(b,inSet) || (freq[b]||0)-(freq[a]||0));
    const open=MK.open[ty], show=open?arr:arr.slice(0,Math.max(MAX_TAGS,arr.filter(on).length));
    return `<div class="fg"><h3>${esc(t("types")[ty]||ty)}</h3>
      ${show.map(x=>`<button class="fopt${on(x)?" on":""}" role="checkbox" aria-checked="${on(x)}" data-act="${on(x)?"mkoff":"mkon"}" data-id="${esc(x)}"><i></i><span>${esc(tagName(x))}</span><span class="num">${on(x)?"":freq[x]}</span></button>`).join("")}
      ${arr.length>show.length?`<button class="fmore" data-act="fmore" data-id="${ty}">${t("fmore")} (${arr.length-show.length})</button>`:""}</div>`;
  }).join("");
}
// 약사 질문: 결과를 더 좁힐 수 있을 때, 상담하듯 "어느 쪽인지" 물어봅니다.
//  1) 태그 엔진에서 상위-하위로 이어 둔 묶음이 결과 안에 있으면 그 상위 분류로 묻고 (예: 크림 → 재생크림/핸드크림/멍크림)
//  2) 없으면 결과를 가장 잘 나누는 태그 몇 개로 묻습니다.
function askNext(pool){
  if(!MK.q||MK.qBusy||MK.noAsk||pool.length<4) return null;
  const used=new Set(); [...MK.tags,...MK.qTags].forEach(x=>tagGroup(x).forEach(g=>used.add(g)));
  const picked=new Set(); MK.tags.forEach(x=>tagGroup(x).forEach(g=>picked.add(g)));
  const cnt=x=>{ const g=new Set(tagGroup(x)); return pool.filter(p=>p.tag_ids.some(y=>g.has(y))).length; };
  const freq={}; pool.forEach(p=>p.tag_ids.forEach(x=>{ if(TAG_MASTER[x]&&!isClassTag(x)&&askableTag(x)) freq[x]=(freq[x]||0)+1; }));
  const kids={}; Object.keys(freq).forEach(x=>{ if(picked.has(x)||freq[x]>=pool.length) return; parentsOf(x).forEach(par=>(kids[par]=kids[par]||[]).push(x)); });
  const last=MK.tags[MK.tags.length-1], lastG=new Set(last?tagGroup(last):[]);
  let best=null;
  const asked=new Set(); if(!MK.tags.length) MK.qTags.forEach(x=>tagGroup(x).forEach(g=>asked.add(g)));
  Object.keys(kids).forEach(par=>{ const ks=kids[par]; const drill=lastG.has(par)||asked.has(par);   // 방금 고른(또는 검색한) 분류의 하위면 바로 이어서 묻기
    const hit=pool.filter(p=>ks.some(k=>p.tag_ids.includes(k))).length;
    if(ks.length<2||(!drill&&hit<pool.length*0.3)) return;                                            // 결과의 30%도 못 나누는 묶음으로는 묻지 않음
    const cover=hit + (drill?1e6:0);
    if(!best||cover>best.cover) best={par,ks,cover}; });
  if(best){ const opts=best.ks.sort((a,b)=>freq[b]-freq[a]).slice(0,6).map(x=>({id:x,n:cnt(x)}));
    return { q:(TAG_MASTER[best.par].question)||t("askKind",tagName(best.par)), opts }; }
  const opts=nextTags(pool,[...used],last).filter(askableTag).slice(0,5).map(x=>({id:x,n:cnt(x)})).filter(o=>o.n>0&&o.n<pool.length);
  return opts.length>=2 ? { q:t("askWhich"), opts } : null;
}
// 화면: ① AI 가 약사처럼 만든 질문 (되면) → ② 안 되면 분류 버튼으로 묻기
function askCands(pool){
  const used=new Set(); [...MK.tags,...MK.qTags].forEach(x=>tagGroup(x).forEach(g=>used.add(g)));
  const freq={}; pool.forEach(p=>p.tag_ids.forEach(x=>{ if(TAG_MASTER[x]&&!isClassTag(x)&&askableTag(x)&&!used.has(x)) freq[x]=(freq[x]||0)+1; }));
  const seen=new Set();
  return Object.keys(freq).filter(x=>freq[x]<pool.length).sort((a,b)=>freq[b]-freq[a])
    .map(x=>({id:x,name:tagName(x,"kr"),n:freq[x]})).filter(c=>c.name&&!seen.has(c.name)&&seen.add(c.name)).slice(0,28);
}
// 질문의 기준이 되는 태그: 방금 고른 태그, 없으면 이해한 태그 중 가장 좁은(제품 수가 적은) 것
function askKeyTag(){
  if(MK.tags.length) return MK.tags[MK.tags.length-1];
  let best=null,bn=1e9; MK.qTags.forEach(x=>{ const g=new Set(tagGroup(x)); const n=PRODUCTS.filter(p=>p.tag_ids.some(y=>g.has(y))).length; if(n>0&&n<bn){ bn=n; best=x; } });
  return best;
}
// 약사가 카드로 승인해 둔 질문 (약사 층에 저장) — 있으면 AI 를 부르지 않고 바로 씁니다
function savedAsk(pool){
  const kt=askKeyTag(); if(!kt||LANG!=="kr") return null;
  const picked=new Set(); MK.tags.forEach(x=>tagGroup(x).forEach(g=>picked.add(g)));
  for(const g of tagGroup(kt)){ const a=PREFS[g]&&PREFS[g].ask; if(!a||!a.q||!Array.isArray(a.opts)) continue;
    const opts=a.opts.filter(o=>o&&o.label&&TAG_MASTER[o.id]&&!picked.has(o.id)).map(o=>{ const s=new Set(tagGroup(o.id)); return {label:o.label,id:o.id,n:pool.filter(p=>p.tag_ids.some(y=>s.has(y))).length}; })
      .filter(o=>o.n>0&&o.n<pool.length);
    if(opts.length>=2) return {q:a.q,opts}; }
  return null;
}
// AI 가 즉석으로 만든 질문은 "승인 대기"로 남깁니다 → 약사가 카드에서 승인·수정하면 다음부터 그 질문이 바로 뜹니다
const ASK_LOGGED=new Set();
function logAskDraft(q,opts){
  const kt=askKeyTag(); if(!USE_FIREBASE||LANG!=="kr"||!kt||ASK_LOGGED.has(kt)) return; ASK_LOGGED.add(kt);
  db.collection("ask_drafts").add({ pid:PHARMACIST_ID, tag:kt, tagName:tagName(kt,"kr"), raw:String(MK.q).slice(0,200), q:String(q).slice(0,200),
    opts:opts.slice(0,5).map(o=>({label:String(o.label).slice(0,60),id:o.id})), timestamp:firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
}
async function fetchAsk(key,pool){
  const cands=askCands(pool); let r=null;
  if(cands.length>=2){ try{ r=await aiAsk(MK.q, MK.qTags.map(x=>tagName(x,"kr")), cands, MK.hist||[], pool.length); }catch(e){ r=null; } }
  if(!MK.ask||MK.ask.key!==key) return;                       // 그 사이 검색·조건이 바뀌었으면 버림
  const by={}; cands.forEach(c=>by[c.name]=c); const seen=new Set();
  const opts=((r&&Array.isArray(r.options))?r.options:[]).map(o=>({label:String((o&&o.label)||"").trim(),c:by[String((o&&o.tag)||"").trim()]}))
    .filter(o=>o.label&&o.c&&!seen.has(o.c.id)&&seen.add(o.c.id)).slice(0,4).map(o=>({label:o.label,id:o.c.id,n:o.c.n}));
  MK.ask = (r&&r.question&&opts.length>=2) ? {key,state:"ok",q:String(r.question).trim(),opts}
         : r ? {key,state:"none"}                              // AI 가 "물을 만한 것이 없다"고 한 경우: 억지로 묻지 않음
         : {key,state:"fail"};                                 // AI 를 못 쓴 경우에만 분류 버튼으로 대신 묻기
  if(MK.ask.state==="ok") logAskDraft(MK.ask.q,MK.ask.opts);
  if(VIEW==="market") renderMarket();
}
function askHTML(pool){
  if(!MK.q||MK.qBusy||MK.noAsk||pool.length<4) return "";
  const skip=`<button class="pq-opt skip" data-act="asknone">${t("askSkip")}</button>`;
  const box=(q,inner)=>`<div class="pq"><p class="pq-h">${PH_ICON}<span>${esc(q)}</span></p><div class="pq-opts">${inner}${skip}</div></div>`;
  if(MK.tags.length<3){                                        // 세 번까지만 되묻습니다
    const key=MK.q+"|"+MK.tags.join(",")+"|"+LANG;
    if(!MK.ask||MK.ask.key!==key){ const sv=savedAsk(pool);
      if(sv) MK.ask={key,state:"ok",q:sv.q,opts:sv.opts,saved:true}; else{ MK.ask={key,state:"busy"}; fetchAsk(key,pool); } }
    if(MK.ask.state==="busy") return `<div class="pq"><div class="wait"><i></i><i></i><i></i><span>${t("askBusy")}</span></div></div>`;

}

function shownTags(p){
  const all=p.tag_ids.filter(x=>TAG_MASTER[x]&&!isClassTag(x)&&!hiddenTag(x)), seen=new Set();
  const uniq=a=>a.filter(x=>{ const l=tagName(x).toLowerCase(); if(seen.has(l)) return false; seen.add(l); return true; });
  const order=["증상","성분","부위"], main=all.filter(x=>order.includes(tagType(x))).sort((a,b)=>order.indexOf(tagType(a))-order.indexOf(tagType(b)));
  return main.length ? uniq(main).slice(0,5) : uniq(all.filter(x=>tagType(x)!=="브랜드")).slice(0,4);

async function submitOrder(form){
  const data=Object.fromEntries(new FormData(form).entries());
  let firstBad=null;
  form.querySelectorAll(".fld").forEach(l=>{
    const inp=l.querySelector("input,textarea"), v=inp.value.trim();
    const bad=(inp.required&&!v) || (l.dataset.k==="phone"&&v&&v.replace(/\D/g,"").length<8);
    l.classList.toggle("bad",bad); inp.setAttribute("aria-invalid",bad); if(bad&&!firstBad) firstBad=inp;
  });
  if(firstBad){ firstBad.focus(); return; }
  const tt=totals(), now=new Date();
  const order={
    id:"EP"+now.toISOString().slice(2,10).replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,6).toUpperCase(),
    createdAt:now.toISOString(), lang:LANG, status:"payment_pending",
    items:tt.items.map(({p,qty})=>({id:p.id,name:p.name,price:p.price,qty})),
    subtotal:tt.subtotal, shipping:tt.shipping, total:tt.total, payMethod:data.pay,
    buyer:{name:data.name.trim(),phone:data.phone.trim(),email:(data.email||"").trim()},
    address:{zip:data.zip.trim(),addr1:data.addr1.trim(),addr2:(data.addr2||"").trim(),memo:(data.memo||"").trim()}
  };
  const {pay,...buyer}=data; store.set("epiris_buyer",buyer);
  form.querySelector("[type=submit]").disabled=true;
  await EPIRIS_HOOKS.saveOrder(order);
  const payment=await EPIRIS_HOOKS.requestPayment(order);          // ← 결제 연동 지점
  if(payment&&payment.status==="paid"){
    order.status="paid"; order.payment=payment;
    await EPIRIS_HOOKS.saveOrder(order);
    await EPIRIS_HOOKS.onPaid(order,payment);                      // ← 결제 후 처리
    order.shipment=await EPIRIS_HOOKS.createShipment(order);       // ← 배송 접수
    BAG={}; saveBag();
  }
  LAST_ORDER=order; nav("done");
}

const MIC=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>`;
// 마이크: 누른 버튼의 data-for 입력칸에 받아쓰고, 말이 끝나면 그 칸의 동작(상담/검색)을 실행
function toggleMic(btn){
  if(recog){ try{recog.stop();}catch(e){} return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast(t("micNo")); return; }
  const inp=$((btn&&btn.dataset.for)||"q"); if(!inp) return;
  const ph=inp.placeholder; let done=false;
  recog=new SR(); recog.lang=SPEECH_LANG[LANG]||"en-US"; recog.interimResults=true;
  recog.onstart=()=>{ btn.classList.add("live"); inp.placeholder=t("listening"); };
  recog.onresult=e=>{ let s=""; for(const r of e.results) s+=r[0].transcript; inp.value=s;
    if(e.results[e.results.length-1].isFinal&&!done){ done=true; if(inp.id==="q") send(); else if(inp.form) inp.form.requestSubmit(); } };
  recog.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed") toast(t("micDenied")); };
  recog.onend=()=>{ if(document.contains(btn)) btn.classList.remove("live"); if(document.contains(inp)) inp.placeholder=ph; recog=null; };
  try{ recog.start(); }catch(e){ recog=null; }
}

function openIntro(){
  const g=INTRO[LANG]||INTRO.en;
  $("intro").innerHTML=`<div class="intro-brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5" stroke="#fff" stroke-width="2"/><path d="M16.2 16.2 21 21" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M10.5 7v7M7 10.5h7" stroke="#1DB7A6" stroke-width="2.4" stroke-linecap="round"/></svg>EPIRIS</div>
      <div><p class="intro-say">Find What Fits You.</p><p class="intro-sub">${esc(g[1])}</p></div>
      <p class="intro-fine">8pharmacy.kr</p>
    </div>
    <div class="intro-pick"><h2>${esc(g[0])}${LANG==="en"?"":"<br>"+INTRO.en[0]}</h2>
      <div class="intro-list">${LANGS.map(([c])=>`<button data-act="introlang" data-id="${c}" lang="${c==="kr"?"ko":c==="jp"?"ja":c==="cn"||c==="tw"?"zh":c==="vn"?"vi":c}" ${c===LANG?'aria-current="true"':""}><i class="flag">${FLAG[c]}</i><b>${LANG_NAME[c]}</b><span>${LANG_EN[c]}</span></button>`).join("")}</div>
    </div>`;
  $("intro").classList.add("on"); document.body.style.overflow="hidden";
  const cur=$("intro").querySelector("[aria-current]"); if(cur) cur.focus();
}
function closeIntro(code){
  if(!$("intro").classList.contains("on")) return;
  if(code){ LANG=code; $("langsel").value=LANG; }
  store.set("epiris_lang",LANG); store.set("epiris_intro_seen",1);
  $("intro").classList.remove("on"); document.body.style.overflow=""; applyLang();
}
function send(){ const v=$("q").value; $("q").value=""; $("q").style.height=""; consult(v); }
function pickCat(tid){ MK.qSeq++; MK.qBusy=false; MK.qTags=[]; MK.tags=[tid]; MK.q=""; MK.shown=24; $("hdq").value=""; nav("market"); }

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const id=el.dataset.id, a=el.dataset.act;
  if(a==="login"){ login(); return; }
  if(a==="logout"){ if(window.firebase&&firebase.auth) firebase.auth().signOut(); return; }
  if((a==="bag"||a==="add"||a==="pdadd")&&!SHOP_OPEN) return;
  if(a==="bag") openBag();
  else if(a==="menu") openSheet("menuSheet");
  else if(a==="filter"){ renderFilterSheet(); openSheet("filterSheet"); }
  else if(a==="close") closeSheets();
  else if(a==="send") send();
  else if(a==="mic") toggleMic(el);
  else if(a==="introlang") closeIntro(id);
  else if(a==="starter") ask(id);
  else if(a==="narrow") narrow(id);
  else if(a==="rest"){ MSGS[id].open=true; renderThread(); }
  else if(a==="hometab"){ HOME_TAB=+id; renderHome(); }
  else if(a==="cat") pickCat(id);
  else if(a==="add") addToBag(id,1);
  else if(a==="pdinc"){ PD_QTY=Math.min(PD_QTY+1,99); renderProduct(); }
  else if(a==="pddec"){ PD_QTY=Math.max(PD_QTY-1,1); renderProduct(); }
  else if(a==="pdadd"){ addToBag(ARG,PD_QTY); PD_QTY=1; openBag(); }
  else if(a==="inc") setQty(id,1);
  else if(a==="dec") setQty(id,-1);
  else if(a==="rm"){ delete BAG[id]; saveBag(); renderBag(); render(); }
  else if(a==="askabout"){ const p=PMAP[id]; nav("consult"); $("q").value=p.name+" "; $("q").focus(); }
  else if(a==="mkon"){ if(!MK.tags.includes(id)) MK.tags.push(id); MK.shown=24; renderMarket(); }
  else if(a==="asknone"){ MK.noAsk=true; renderMarket(); }
  else if(a==="pqpick"){ const o=MK.ask&&MK.ask.opts&&MK.ask.opts[+id]; if(o){ (MK.hist=MK.hist||[]).push({q:MK.ask.q,a:o.label}); if(!MK.tags.includes(o.id)) MK.tags.push(o.id); MK.shown=24; renderMarket(); } }
  else if(a==="mkoff"){ MK.tags=MK.tags.filter(x=>x!==id); renderMarket(); }
  else if(a==="mkclear"){ MK.noAsk=false; MK.hist=[]; MK.ask=null; MK.qSeq++; MK.qBusy=false; MK.qTags=[]; MK.tags=[]; MK.q=""; $("hdq").value=""; renderMarket(); }
  else if(a==="askq") ask(MK.q);
  else if(a==="mkmore"){ MK.shown+=24; renderMarket(); }
  else if(a==="fmore"){ MK.open[id]=true; renderMarket(); }
  else if(a==="admin") openAdmin();
});
document.addEventListener("submit",e=>{
  const f=e.target; e.preventDefault();
  if(f.id==="heroAsk") ask($("heroQ").value);
  else if(f.id==="hdSearch"){ MK.tags=[]; runSearch($("hdq").value); }
  else if(f.id==="mkForm"){ runSearch($("mkq").value); }
  else if(f.id==="coForm") submitOrder(f);
  else if(f.id==="adminForm") saveAdmin(f);
});
document.addEventListener("change",e=>{
  if(e.target.id==="mksort"){ MK.sort=e.target.value; renderMarket(); }
  else if(e.target.id==="langsel"){ LANG=e.target.value; store.set("epiris_lang",LANG); applyLang(); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if($("intro").classList.contains("on")) closeIntro(); else closeSheets(); return; }
  if(e.key==="Tab"){ const s=document.querySelector(".intro.on")||document.querySelector(".sheet.on"); if(!s) return;      // 열린 창 안에서만 포커스 이동
    const f=[...s.querySelectorAll("a[href],button:not([disabled]),input,select,textarea")]; if(!f.length) return;
    if(e.shiftKey&&document.activeElement===f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey&&document.activeElement===f[f.length-1]){ e.preventDefault(); f[0].focus(); } }
});
$("q").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); send(); }});
document.addEventListener("input",e=>{ const l=e.target.closest&&e.target.closest(".fld.bad"); if(l){ l.classList.remove("bad"); e.target.removeAttribute("aria-invalid"); } });
$("q").addEventListener("input",e=>{ e.target.style.height=""; e.target.style.height=Math.min(e.target.scrollHeight,120)+"px"; });

/* 구글 로그인 (가격 보기용). Firebase 콘솔에서 Google 로그인을 켜고, 사이트 주소를 승인된 도메인에 넣어야 동작합니다 */
async function login(){
  if(!(window.firebase&&firebase.auth)){ toast(t("loginFail")); return; }
  if(location.protocol==="file:"){ toast(t("loginLocal")); return; }
  try{ await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); toast(t("loginOk")); }
  catch(e){ const c=e&&e.code||"";
    if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") return;
    toast(c==="auth/operation-not-allowed"||c==="auth/configuration-not-found"?t("loginOff"):c==="auth/unauthorized-domain"?t("loginDomain"):c==="auth/operation-not-supported-in-this-environment"?t("loginLocal"):t("loginFail")+" ("+(c||e.message)+")"); }
}

window.addEventListener("DOMContentLoaded",async()=>{
  $("langsel").innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join("");
  const urlLang=(location.search.match(/[?&]lang=([a-z]{2})/)||[])[1];
  const nl=(navigator.language||"ko").toLowerCase();
  const guess = nl.startsWith("ko")?"kr":nl.startsWith("ja")?"jp":nl.startsWith("zh-tw")||nl.startsWith("zh-hk")?"tw":nl.startsWith("zh")?"cn":nl.startsWith("th")?"th":nl.startsWith("vi")?"vn":nl.startsWith("id")?"id":nl.startsWith("mn")?"mn":"en";
  LANG = urlLang || store.get("epiris_lang",null) || guess;
  if(!LANGS.some(([c])=>c===LANG)) LANG="en";
  $("langsel").value=LANG;
  if(ADMIN_MODE) $("adminBtn").hidden=false;
  BAG=store.get("epiris_bag",{});
  applyLang(); route(); saveBag();
  if(/[?&]intro=1/.test(location.search) || (!urlLang && !store.get("epiris_intro_seen",0))) openIntro();
  try{
    initFirebase();
    if(USE_FIREBASE&&firebase.auth) firebase.auth().onAuthStateChanged(u=>{ USER=u; if(LOADED){ renderChrome(); render(); } });
    await loadData();
  }catch(e){ console.error("[EPIRIS] 시작 오류:",e); DATA_STATE={source:"demo",error:String(e&&e.message||e)}; loadDemo(); }
  PMAP={}; PRODUCTS.forEach(p=>PMAP[p.id]=p);
  LOADED=true; saveBag(); applyLang(); route();
  loadLearned();
});
